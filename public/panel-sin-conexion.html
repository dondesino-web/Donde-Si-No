<!doctype html>
<html lang="es-CL">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex, nofollow" />
		<meta name="theme-color" content="#0b2a6f" />
		<title>Sin conexión · Panel · Dónde Si No</title>
		<style>
			body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 1.5rem; background: #fffbf0; color: #1a1a1a; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; line-height: 1.5; text-align: center; }
			main { max-width: 26rem; }
			img { border-radius: 50%; margin-bottom: 1rem; }
			h1 { color: #0b2a6f; font-size: 1.6rem; margin: 0 0 0.75rem; }
			a, button { display: inline-flex; align-items: center; justify-content: center; min-height: 2.75rem; padding: 0.5rem 1.5rem; margin-top: 1rem; border: 2px solid #c8102e; border-radius: 999px; background: #c8102e; color: #fff; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
			:focus-visible { outline: 3px solid #0b2a6f; outline-offset: 2px; }
		</style>
	</head>
	<body>
		<main>
			<img src="/marca/logo-160.webp" width="96" height="96" alt="" />
			<h1>Sin conexión</h1>
			<p>El panel necesita internet para mostrar y guardar tus cambios. Revisa tu conexión e inténtalo de nuevo.</p>
			<p>La carta que ven tus clientes no se ve afectada.</p>
			<button type="button" onclick="location.reload()">Reintentar</button>
		</main>
	</body>
</html>
